    <h1> Region pacifico</h1>
    <p>La región del Pacífico[1] es una de las seis regiones naturales de Colombia, la cual corresponde en su mayoría al
        "Chocó biogeográfico". Comprende casi la totalidad del departamento del Chocó, y las zonas costeras de los
        departamentos del Valle del Cauca, Cauca y Nariño.</p>
