    <h1> Region amazonia</h1>
    <p>La región Amazónica de Colombia, o Amazonía, es una de las seis regiones naturales de Colombia. Está ubicada al sur del país limitando al norte con las regiones Andina y Orinoquía, al este con Venezuela, al sureste con Brasil, al sur con Perú y al suroeste con Ecuador.</p>
